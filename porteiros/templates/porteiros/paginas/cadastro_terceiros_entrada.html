{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="{% static 'css/cad_style.css' %}" />

    <link rel="icon" href="{% static 'images/inter.png' %}" type="image/x-icon" />

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <title>Portaria</title>
  </head>
  <body>
    <div class="container">
      <form action="{% url 'cadastro_terceiros' %}" method="post" autocomplete="off" onsubmit="return validateForm()">
        {% csrf_token %}

        <hr />
        <nav>
          <div class="placat_entrada">
            <label style="font-size: 1.4rem">Placa:</label>
            <input type="text" name="placa_entrada" id="placa-entrada" oninput="this.value = this.value.toUpperCase()" onkeypress="buscarPorTeclaEnter(event)" onblur="buscarPorMudancaCampo()" required /><br />
            <label style="font-size: 1.4rem">Veículo:</label>
            <!-- <input type="text" name="veiculo_entrada" oninput="this.value = this.value.toUpperCase()" required /> -->
            <select class="tip_veic" name="veiculo_entrada" style="cursor: pointer;" required>
              <option disabled selected>...</option>
              <option>BAÚ</option>
              <option>BAÚ FRIGORÍFICO</option>
              <option>CARRETA</option>
              <option>CARRETA FRIGORÍFICO</option>
              <option>TOCO</option>
              <option>MOTO</option>
              <option>KOMBI</option>
              <option>SPRINTER</option>
              <option>PASSEIO</option>
              <option>OUTROS</option>
            </select>
          </div>

          <div class="cabeçalho">Terceiros - Entrada</div>
          <div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</div>
        </nav>
        <hr />

          <div class="bloco">
            <div class="relogio">
              <input type="text" name="data" style="text-align: center;" id="data_hora_input" value="{{ data_hora_atual }}" disabled readonly />
            </div>
          </div>

          <div class="bloco">
            <div class="carga_terc">
              <label for="">Carga:</label><br />
              <select name="carga_entrada" style="cursor: pointer;" required>
                <option disabled selected>...</option>
                <option>ADM</option>
                <option>FRIGORÍFICO</option>
                <option>MANUTENÇÃO</option>
                <option>OFICINA</option>
                <option>SECA</option>
                <option>OUTROS</option>
              </select>
            </div>


            <div class="cnpj">
              <label for="">CNPJ da Empresa:</label>
              <input id="cnpj-input" type="number" name="cnpj" required />
              <input id="nome-input" class="id" type="text" name="nome" readonly />
            </div>
          </div>

          <div class="bloco">
            <div class="produto">
              <label>Produto</label><br />
              <input type="text" name="produto" oninput="this.value = this.value.toUpperCase()" required />
            </div>
            <div class="motorista">
              <label>Motorista</label><br />
              <input type="text" name="motorista" oninput="this.value = this.value.toUpperCase()" required />
            </div>
            <!-- <div class="documento_motorista">
                <label>Documento Motorista</label><br />
                <input type="number" name="documento_motorista" oninput="this.value = this.value.toUpperCase()" required />
              </div> -->
          </div>

          <div class="bloco">
            <div class="ajudante">
              <label>Nº de Ajudantes:</label><br />
              <input type="number" name="ajudante" oninput="this.value = this.value.toUpperCase()" required />
            </div>

            <div class="paletes">
              <label>QTDE Paletes Recebidos:</label>
              <input type="number" name="paletes" required />
            </div>
          </div>

          <div class="bloco">
            <div class="chapelex">
              <label>QTDE Chapelex Recebidos:</label>
              <input type="number" name="chapelex" required />
            </div>

            <div class="nfs">
              <label class="index">NF'S de Entrada / Nota fiscal:</label>

              <input type="text" name="nfs" oninput="this.value = this.value.toUpperCase()" required />

              <!--      <label>Prefixo:</label>
                <input type="number" name="nfs_prefixo" required><br>
      
                <label>De:</label>
                <input type="number" name="nfs_de" required><br>
      
                <label>Até:</label>
                <input type="number" name="nfs_ate" required><br>
      
                <label>Exceto:</label>
                <input type="number" name="nfs_exceto" required><br>
      
                <label>Apenas:</label>
                <input type="number" name="nfs_apenas" required>      -->
            </div>
          </div>

          <div class="bloco">
            <div class="botão">
              <input class="Salvar" type="submit" value="Salvar" style="cursor: pointer;" />

              <a href="{% url 'cadastro_terceiros' %}"><input type="button" id="cancelar" value="Cancelar" style="cursor: pointer;" /></a>

              <a href="{% url 'cadastro' %}"><input type="button" id="sair" value="Sair" style="cursor: pointer;" /></a>
            </div>
          </div>
        </div>
      </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      function atualizarRelogio() {
        var dataHoraAtual = new Date().toLocaleString()
        document.getElementById('data_hora_input').value = dataHoraAtual
      }
      
      atualizarRelogio()
      
      setInterval(atualizarRelogio, 1000)
      
      //--------------------------------------------------------
      
      function validateForm() {
        var inputs = document.getElementsByTagName('input')
        var selects = document.getElementsByTagName('select')
        var isValid = true
      
        for (var i = 0; i < inputs.length; i++) {
          if (inputs[i].hasAttribute('required') && inputs[i].value === '') {
            isValid = false
            break
          }
        }
      
        for (var i = 0; i < selects.length; i++) {
          if (selects[i].hasAttribute('required') && selects[i].value === '') {
            isValid = false
            break
          }
        }
      
        if (!isValid) {
          alert('Por favor, preencha todos os campos obrigatórios.')
        }
      
        return isValid
      }
      
      //----------------------------------------------------------
      
      $(document).ready(function () {
          $('input[name="cnpj"]').on('blur', function (event) {
              event.preventDefault();
              
              // Formatando o CNPJ para remover caracteres especiais
              var cnpj = $(this).val().replace(/[^\d]/g, '');
              
              // Se campo estiver vazio, não faz nada
              if (!cnpj) {
                  $('#nome-input').val('');
                  return;
              }
              
              // Validar se o CNPJ tem 14 dígitos
              if (cnpj.length !== 14) {
                  mostrarMensagem('CNPJ deve ter exatamente 14 dígitos', 'erro');
                  $('#nome-input').val('');
                  return;
              }
              
              var csrftoken = getCookie('csrftoken');
              
              $.ajax({
                  url: '{% url "verificar_cnpj" %}',
                  method: 'POST',
                  data: { cnpj: cnpj },
                  headers: { 'X-CSRFToken': csrftoken },
                  success: function (response) {
                      if (response.erro) {
                          mostrarMensagem(response.erro, 'erro');
                          $('#nome-input').val('');
                      } else if (response.existe) {
                          // Preenche o campo nome com o valor retornado
                          $('#nome-input').val(response.nome_empresa);
                          mostrarMensagem('CNPJ encontrado: ' + response.nome_empresa, 'sucesso');
                      } else {
                          // Limpa o campo nome se CNPJ não existir
                          $('#nome-input').val('');
                          mostrarMensagem('CNPJ não cadastrado. Clique aqui para cadastrar.', 'aviso', function() {
                              window.location.href = "{% url 'cadastro_cnpj_terceiros' %}";
                          });
                      }
                  },
                  error: function () {
                      mostrarMensagem('Erro ao verificar CNPJ', 'erro');
                      $('#nome-input').val('');
                  }
              });
          });
      });
      
      // Função para mostrar mensagens personalizadas
      function mostrarMensagem(mensagem, tipo, callback) {
          // Remove mensagens anteriores
          $('.mensagem-cnpj').remove();
          
          // Cria elemento para a mensagem
          var divMensagem = $('<div class="mensagem-cnpj mensagem-' + tipo + '"></div>');
          divMensagem.text(mensagem);
          
          // Adiciona estilos básicos
          divMensagem.css({
              'padding': '10px',
              'margin': '10px 0',
              'border-radius': '4px',
              'font-size': '14px',
              'cursor': tipo === 'aviso' ? 'pointer' : 'default'
          });
          
          // Define cores baseadas no tipo
          if (tipo === 'erro') {
              divMensagem.css({
                  'background-color': '#ffebee',
                  'color': '#c62828',
                  'border': '1px solid #ef9a9a'
              });
          } else if (tipo === 'sucesso') {
              divMensagem.css({
                  'background-color': '#e8f5e9',
                  'color': '#2e7d32',
                  'border': '1px solid #a5d6a7'
              });
          } else if (tipo === 'aviso') {
              divMensagem.css({
                  'background-color': '#fff3e0',
                  'color': '#ef6c00',
                  'border': '1px solid #ffcc80'
              });
          }
          
          // Adiciona a mensagem após o campo CNPJ
          $('#cnpj-input').after(divMensagem);
          
          // Se for uma mensagem clicável (para cadastro)
          if (tipo === 'aviso' && callback) {
              divMensagem.on('click', callback);
          }
          
          // Remove a mensagem após 5 segundos (exceto avisos clicáveis)
          if (tipo !== 'aviso') {
              setTimeout(function() {
                  divMensagem.fadeOut(500, function() {
                      $(this).remove();
                  });
              }, 5000);
          }
      }
      
      // Função para obter o token CSRF
      function getCookie(name) {
          var cookieValue = null;
          if (document.cookie && document.cookie !== '') {
              var cookies = document.cookie.split(';');
              for (var i = 0; i < cookies.length; i++) {
                  var cookie = cookies[i].trim();
                  if (cookie.substring(0, name.length + 1) === name + '=') {
                      cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                      break;
                  }
              }
          }
          return cookieValue;
      }
      //------------------------------------------------------------
      
      function buscarPorTecla() {
        const placaEntrada = document.getElementById('placa-entrada').value.toUpperCase()
        const url = '{% url "busca_terceiros" %}'
      
        $.ajax({
          url: url,
          type: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
          },
          data: JSON.stringify({ placa: placaEntrada }),
          dataType: 'json',
          success: function (data) {
            if (data.placa_entrada_existente && data.placa_saida_existente) {
            } else if (data.placa_entrada_existente) {
              const placa = encodeURIComponent(placaEntrada)
              window.location.href = '{% url "cadastro_terceiros_saida" %}?placa=' + placa
            } else {
            }
          },
          error: function (error) {
            console.error('Erro na requisição:', error)
          }
        })
      }
      
      document.getElementById('placa-entrada').addEventListener('input', buscarPorTecla)
      
      // ---------------------------------------------------------------------------
      
      $(document).ready(function () {
        $('input[name="cnpj"]').change(function (event) {
          event.preventDefault()
      
          var cnpj = $(this).val()
      
          // Obter o token CSRF do cookie
          var csrftoken = getCookie('csrftoken')
      
          $.ajax({
            url: '{% url "buscar_nome_por_cnpj" %}',
            method: 'POST',
            data: { cnpj: cnpj },
            headers: { 'X-CSRFToken': csrftoken }, // Incluir o token CSRF nos cabeçalhos
            success: function (response) {
              if (response.nome) {
                $('#nome-input').val(response.nome)
                $('#nome-input').prop('readonly', true)
              } else {
                $('#nome-input').val('CNPJ não cadastrado')
              }
            }
          })
        })
      })
      
      // Função para obter o token CSRF do cookie
      function getCookie(name) {
        var cookieValue = null
        if (document.cookie && document.cookie !== '') {
          var cookies = document.cookie.split(';')
          for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim()
            if (cookie.substring(0, name.length + 1) === name + '=') {
              cookieValue = decodeURIComponent(cookie.substring(name.length + 1))
              break
            }
          }
        }
        return cookieValue
      }
    </script>
  </body>
</html>
