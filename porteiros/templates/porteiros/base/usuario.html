{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="{% static 'css/usuario.css' %}" />

    <link rel="icon" href="{% static 'images/inter.png' %}" type="image/x-icon" />

    <title>Portaria</title>
  </head>
  <body>
    <div class="container">
      <!-- Logo -->
      <div class="logo-container">
        <img src="{% static 'images/logo.png' %}" alt="Logo" />
      </div>
      <div class="contact-form">
        <h2>Controle de Entrada e Saída de Veículos</h2>
        <form method="post" autocomplete="off">
          {% csrf_token %}
          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" placeholder="Digite o nome" maxlength="50" required oninput="this.value = this.value.toUpperCase()" /><br />
          <label for="matricula">Matrícula:</label>
          <input type="text" id="matricula" name="matricula" placeholder="Digite a matrícula" pattern="\d*" maxlength="10" required oninput="this.value = this.value.toUpperCase()" /><br />
          <label for="senha">Senha:</label>
          <input type="password" name="senha" id="senha" placeholder="Digite a senha" required /><br />
          <button class="mostrar_senha" type="button" onclick="mostrarSenha()">Mostrar Senha</button>
          <div class="nivel">
            <label for="tipo">Nível do usuário:</label>
            <div class="opcao">
              <input type="radio" id="gerente" name="nivel" value="gerente" required />
              <label for="gerente">Gerente</label>
            </div>
            <div class="opcao">
              <input type="radio" id="funcionario" name="nivel" value="funcionario" required />
              <label for="funcionario">Funcionário</label>
            </div>
          </div>
          <button class="cadastrar" value="cadastrar" style="cursor: pointer;">Cadastrar</button>
          <a href="{% url 'cadastro' %}" style="display: inline-block; text-align: center; padding: 10px; background: rgba(255, 255, 255, 0.2); color: white; border-radius: 25px; text-decoration: none; margin-top: 10px; transition: background 0.3s ease-in-out;">Voltar</a>
        </form>
        <script>
          function mostrarSenha() {
            var senhaInput = document.getElementById('senha')
            senhaInput.type = senhaInput.type === 'password' ? 'text' : 'password'
          }
        </script>
      </div>
    </div>
  </body>
</html>
